[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "russian-labor-market-analysis"
version = "1.0.0"
description = "Reproducible analysis of Russian labor-force survey data for 2010-2023"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Alisa Karpinskaia", email = "181194713+suxubnatam@users.noreply.github.com" },
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<20",
  "pyreadstat>=1.2.7,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
notebook = [
  "ipykernel>=6,<7",
  "jupyterlab>=4,<5",
]

[project.scripts]
labor-market = "labor_market_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=labor_market_analysis --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
